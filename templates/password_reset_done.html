{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset Sent - KidZone</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'navbar.css' %}">
    <link rel="stylesheet" href="{% static 'footer.css' %}">
    <style>
        :root { --primary: #6366f1; }
        * { margin:0; padding:0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #f8fafc; }
        .reset-container { max-width: 440px; margin: 4rem auto; padding: 0 1rem; }
        .reset-card {
            background: #fff; border-radius: 1.5rem; padding: 2.5rem;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08); text-align: center;
        }
        .reset-icon { font-size: 3rem; margin-bottom: 1rem; }
        .reset-card h1 { font-size: 1.5rem; color: #1e293b; margin-bottom: 0.5rem; }
        .reset-card p { color: #64748b; font-size: 0.9rem; line-height: 1.6; }
        .back-link { display: inline-block; margin-top: 1.5rem; color: #6366f1; text-decoration: none; font-weight: 500; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
{% include 'navbar.html' %}

<div class="reset-container">
    <div class="reset-card">
        <div class="reset-icon">📧</div>
        <h1>Check Your Email</h1>
        <p>We've sent you instructions to reset your password. If an account exists with the email you entered, you will receive a password reset link shortly.</p>
        <a href="{% url 'login' %}" class="back-link">← Back to Login</a>
    </div>
</div>

{% include 'footer.html' %}
</body>
</html>
